name: ShellCheck

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Advisory ShellCheck for active entry points
        continue-on-error: true
        run: |
          shellcheck -x -P . \
            viptrue.sh \
            lib/ui.sh \
            menus/main.sh \
            menus/work.sh \
            menus/utility.sh \
            modules/utility/04-tunnel-manager.sh
