name: ShellCheck

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Strict ShellCheck for download manager paths
        run: |
          shellcheck -x -P . \
            bootstrap.sh \
            lib/download.sh \
            menus/utility.sh \
            modules/private/01-syncplay-server-fixed.sh \
            modules/utility/03-offline-assets-mirror.sh \
            modules/utility/04-tunnel-manager-mirror.sh \
            modules/utility/09-download-mirror-manager.sh

      - name: Advisory ShellCheck for legacy tunnel module
        continue-on-error: true
        run: |
          shellcheck -x -P . modules/utility/04-tunnel-manager.sh
